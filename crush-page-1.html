<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Crushie</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(135deg, #ffd6e8, #fff0f6);
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    padding: 40px 36px;
    width: 320px;
    max-width: 88vw;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 90, 140, 0.25);
    position: relative;
    z-index: 2;
  }

  .heart {
    font-size: 46px;
    animation: beat 1.1s infinite;
    margin-bottom: 4px;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    40% { transform: scale(0.95); }
    60% { transform: scale(1.1); }
  }

  h1 {
    color: #ff4f9a;
    margin: 8px 0 14px;
    font-size: 26px;
  }

  p.message {
    color: #666;
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 22px;
  }

  h2.question {
    color: #333;
    font-size: 19px;
    margin-bottom: 22px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 14px;
    position: relative;
    height: 46px;
  }

  button {
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }

  #yesBtn {
    background: #ff4f9a;
    color: #fff;
  }
  #yesBtn:hover {
    background: #ff3688;
    transform: scale(1.06);
  }

  #noBtn {
    background: #f1f1f1;
    color: #555;
  }

  #smallText {
    margin-top: 18px;
    color: #999;
    font-size: 13px;
    min-height: 18px;
  }

  /* success state */
  .success-screen {
    display: none;
    text-align: center;
  }
  .success-screen h1 {
    font-size: 30px;
  }
  .success-screen p {
    color: #777;
    font-size: 15px;
    margin-top: 8px;
  }

  .wa-button {
    display: inline-block;
    margin-top: 20px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    padding: 12px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .wa-button:hover {
    background: #1ebe5b;
    transform: scale(1.05);
  }

  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 14px;
    border-radius: 2px;
    z-index: 5;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(540deg); opacity: 0.9; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div id="questionView">
    <div class="heart">💗</div>
    <h1>Hey Crushie</h1>
    <p class="message">
      Since this is a website, I guess for me it was love at first site 😅
      <br><br>
      [Edit this message — say whatever you actually want to say here.]
    </p>
    <h2 class="question">Wanna hang out sometime?</h2>
    <div class="buttons">
      <button id="yesBtn">Yes 😊</button>
      <button id="noBtn">No 🙁</button>
    </div>
    <p id="smallText"></p>
  </div>

  <div class="success-screen" id="successView">
    <div class="heart">🎉</div>
    <h1>Yay!! 💗</h1>
    <p>[Edit this — put your actual plan/next step here, like "I'll text you the details!"]</p>
    <a id="waLink" href="#" target="_blank" rel="noopener" class="wa-button">Send on WhatsApp 💬</a>
  </div>
</div>

<script>
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const smallText = document.getElementById('smallText');
  const card = document.getElementById('card');
  const questionView = document.getElementById('questionView');
  const successView = document.getElementById('successView');
  const waLink = document.getElementById('waLink');

  // Your WhatsApp number in international format, no spaces, no "+", no leading 0 after country code
  const WHATSAPP_NUMBER = "233256903036";
  const WHATSAPP_MESSAGE = "Hey! I clicked Yes on your page 😊";

  const taunts = [
    "Bonus points for trying though 😄",
    "Nope, try again 😝",
    "Hii ni mbaya, finya 'Yes' 😂",
    "You know you want to click Yes...",
    "The 'No' button is shy, it keeps running",
    "Ok fine, one more chance 👀"
  ];

  let noCount = 0;

  function moveNoButton() {
    noCount++;

    // grow the Yes button slightly each dodge, for fun escalation
    const growth = Math.min(1 + noCount * 0.08, 1.8);
    yesBtn.style.transform = `scale(${growth})`;

    const cardRect = card.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const maxX = window.innerWidth - btnRect.width - 20;
    const maxY = window.innerHeight - btnRect.height - 20;

    const randomX = Math.max(20, Math.floor(Math.random() * maxX));
    const randomY = Math.max(20, Math.floor(Math.random() * maxY));

    noBtn.style.position = 'fixed';
    noBtn.style.left = randomX + 'px';
    noBtn.style.top = randomY + 'px';

    smallText.textContent = taunts[Math.min(noCount - 1, taunts.length - 1)];
  }

  noBtn.addEventListener('mouseenter', moveNoButton);
  noBtn.addEventListener('click', (e) => {
    // in case of touch devices where mouseenter doesn't fire, dodge on click too
    e.preventDefault();
    moveNoButton();
  });
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    moveNoButton();
  });

  function launchConfetti() {
    const colors = ['#ff4f9a', '#ffd6e8', '#ff8fb8', '#ffe066', '#a0e7e5'];
    for (let i = 0; i < 120; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
      piece.style.opacity = 0.85 + Math.random() * 0.15;
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 4200);
    }
  }

  yesBtn.addEventListener('click', () => {
    questionView.style.display = 'none';
    successView.style.display = 'block';
    launchConfetti();
    setTimeout(launchConfetti, 350);

    const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(WHATSAPP_MESSAGE)}`;
    waLink.href = waUrl;

    // try to open WhatsApp automatically; falls back to the button if blocked
    window.open(waUrl, '_blank');
  });
</script>

</body>
</html>
